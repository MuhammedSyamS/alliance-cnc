  <!-- Ensure social meta images use absolute URLs dynamically based on current origin -->
  <script>
    (function() {
      try {
        var origin = window.location.origin;
        if (origin && origin !== 'null') {
          var metas = document.querySelectorAll('meta[property^="og:image"], meta[name^="twitter:image"]');
          for (var i = 0; i < metas.length; i++) {
            var val = metas[i].getAttribute('content');
            if (val && val.charAt(0) === '/') {
              metas[i].setAttribute('content', origin + val);
            }
          }
        }
      } catch(e) {}
    })();
  </script>
